services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  NITSAN\NsT3afExtended\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Prompt/*'
      - '../Classes/Service/*'
      - '../Classes/Feature/*'
      - '../Classes/Mcp/*'
      - '../Classes/Access/*'
      - '../Classes/Provider/*'

  # Tag rules apply when Services.php loads Provider/Access classes.
  # ns_t3af’s own _instanceof does not cover foreign packages.
  _instanceof:
    NITSAN\NsT3AF\Provider\Contract\AdapterInterface:
      tags: ['nst3af.adapter']
    NITSAN\NsT3AF\Contract\AiAccessCatalogProviderInterface:
      tags: ['t3af.ai_access_catalog_provider']
